# /etc/nginx/conf.d/eeehoc-dashboard.conf
#
# HTTP front door (this instance is eeehoc-only):
#   :80 → dashboard :8083
#   server_name eeehoc.com www.eeehoc.com (IP still works via default_server)
#
# ACME webroot is /var/www/certbot — required before enable-https.sh.
# After certs exist, install-nginx-80.sh / enable-https.sh swap in the
# HTTPS file (scripts/nginx-eeehoc-https.conf).

upstream eeehoc_dashboard {
    server 127.0.0.1:8083;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name eeehoc.com www.eeehoc.com _;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        proxy_pass http://eeehoc_dashboard/health;
    }

    location / {
        proxy_pass http://eeehoc_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
