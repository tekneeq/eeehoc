<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eeehoc — NHL Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="brand-mark">eeehoc</span>
        <span class="brand-sub" id="seasonLabel">NHL</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="live" role="tab" aria-selected="true">
          Live <span class="tab-badge" id="liveBadge" hidden></span>
        </button>
      </nav>
    </header>

    <main>
      <section id="panel-live" class="panel active" role="tabpanel">
        <div class="panel-head">
          <h1>Live</h1>
          <p class="lede">
            Today's NHL slate as chiclets — score, period, shots, goals, and the power play. Open a game for the box score, goalies, and stars.
          </p>
        </div>
        <div class="toolbar live-toolbar">
          <div class="day-nav" role="group" aria-label="Slate day">
            <button type="button" class="chip" id="dayPrev" title="Previous day">‹</button>
            <button type="button" class="chip" id="dayToday">Today</button>
            <span id="dayLabel" class="day-label">—</span>
            <button type="button" class="chip" id="dayNext" title="Next day">›</button>
          </div>
          <div class="chip-group" id="liveFilter" role="group" aria-label="Filter games">
            <button type="button" class="chip active" data-state="all">All</button>
            <button type="button" class="chip" data-state="in">Live</button>
            <button type="button" class="chip" data-state="post">Final</button>
            <button type="button" class="chip" data-state="pre">Upcoming</button>
          </div>
          <div class="live-status">
            <span id="liveMeta" class="live-meta">Loading scoreboard…</span>
            <button type="button" class="refresh" id="liveRefresh" title="Refresh now">Refresh</button>
          </div>
        </div>
        <div id="liveGrid" class="chiclet-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
