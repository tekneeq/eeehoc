services:
  dashboard:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-unknown}
    image: eeehoc-dashboard:latest
    container_name: eeehoc-dashboard
    ports:
      - "8083:8083"
    environment:
      EEEHOC_GIT_SHA: ${GIT_SHA:-unknown}
      EEEHOC_GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-unknown}
    restart: unless-stopped
